# Bilbao Bazaar - API gateway.
#
# The single door into the system. The two microservices listen on the loopback
# interface only, so everything a client can reach, it reaches through here.
#
# What the gateway is responsible for:
#   * routing     /api/products -> products-service, /api/orders -> orders-service
#   * one origin  the storefront and the API share http://localhost:8091, so the
#                 browser makes no cross-origin requests and needs no CORS
#   * identity    every request is stamped with an X-Request-ID and that ID is
#                 forwarded to the services, which is what makes a request
#                 traceable across containers
#   * timeouts    a dead service becomes a fast 503 instead of a hung client
#   * a shaped error, so a client never sees an NGINX HTML error page

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # $upstream_addr is the useful column: it records which container actually
    # served the request, which is the difference between believing the routing
    # works and being able to show it.
    log_format gateway '$remote_addr  "$request"  $status  '
                       '${body_bytes_sent}b  ${request_time}s  '
                       'rid=$request_id  upstream=$upstream_addr';

    access_log /dev/stdout gateway;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    # One named upstream per microservice. Naming them rather than writing the
    # address inline is what allows a second replica to be added on one line.
    upstream products_backend {
        server products-service:8000;
        keepalive 16;
    }

    upstream orders_backend {
        server orders-service:8001;
        keepalive 16;
    }

    # HTTP/1.1 with an emptied Connection header is what lets the keepalive
    # pools above actually be reused; on HTTP/1.0 every proxied request would
    # open a new connection.
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The correlation ID. NGINX generates $request_id per request; the services
    # log it and hand it on, so one ID appears in all three container logs.
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header X-Gateway         nginx-api-gateway;

    proxy_connect_timeout 2s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    # Off (the default, stated explicitly) so a 409 or 503 that a service
    # generated on purpose reaches the client as written. Only errors NGINX
    # itself produces get replaced by the handler below.
    proxy_intercept_errors off;

    # The services echo the correlation ID back, which is useful in their own
    # logs and wrong on the way out: the gateway adds its own X-Request-ID, so
    # the client received the header twice and the storefront displayed
    # "<id>, <id>". Dropping the upstream copy leaves one, from the component
    # that actually minted it.
    proxy_hide_header X-Request-ID;

    server {
        listen      8091;
        server_name _;

        # `always` so the headers are present on error responses too.
        add_header X-Request-ID $request_id always;
        add_header X-Served-By  "api-gateway" always;

        # ------------------------------------------------ the gateway itself
        # The two add_header lines are repeated here, and that repetition is not
        # redundant. add_header does not merge across levels: the moment a
        # location declares one of its own, every add_header inherited from the
        # server block is dropped. The first version of this file set only
        # Content-Type here, and /health came back with no X-Request-ID while
        # every other route had one.
        location = /health {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header X-Served-By  "api-gateway" always;
            return 200 '{"service":"api-gateway","status":"up","routes":["/api/products","/api/orders"]}';
        }

        # ------------------------------------------------------- the routes
        # A URI on proxy_pass replaces the matched prefix, so /api/products/1001
        # arrives at the service as /products/1001. The public path and the
        # internal path are therefore free to differ.
        location /api/products {
            proxy_pass http://products_backend/products;
        }

        location /api/orders {
            proxy_pass http://orders_backend/orders;
        }

        # Each service's own health endpoint, exposed under a tidier path.
        location = /api/status/products {
            proxy_pass http://products_backend/health;
        }

        location = /api/status/orders {
            proxy_pass http://orders_backend/health;
        }

        # ---------------------------------------------------- the storefront
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # The page is fetched on every reload during development; caching it
            # would just hide edits.
            add_header Cache-Control "no-store" always;
        }

        # -------------------------------------------------- shaped failures
        # Without this a stopped container gives the client NGINX's default HTML
        # 502 page, which is a strange thing for a JSON API to return.
        error_page 502 504 = @gateway_error;

        location @gateway_error {
            default_type application/json;
            add_header X-Request-ID $request_id always;
            add_header X-Served-By  "api-gateway" always;
            return 503 '{"error":"upstream service unavailable","gateway":"nginx-api-gateway","request_id":"$request_id"}';
        }
    }
}
