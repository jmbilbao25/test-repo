server:
  port: 9082

spring:
  application:
    name: order-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://localhost:8888}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10

# The Order Service calls the Product Service by its registered name and never
# by host and port. This is the only place the dependency is named at all, and
# it is a logical name, not an address.
product-service:
  name: product-service
